name: Daily Calendar Summary

on:
  schedule:
    # 08:03 JST. GitHub recommends avoiding the top of the hour for schedules.
    - cron: "3 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date in JST (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
      future_only:
        description: "Only process timed events that have not ended yet."
        required: false
        default: false
        type: boolean
      force_resend:
        description: "Ignore Calendar sent markers and resend LINE messages."
        required: false
        default: false
        type: boolean
      skip_discord_summary:
        description: "Send only a manual-run result instead of the full morning summary."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-calendar-summary
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAILY_SUMMARY_TIMEZONE: Asia/Tokyo
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
      DISCORD_DAILY_WEBHOOK: ${{ secrets.DISCORD_DAILY_WEBHOOK }}
      PROLINE_MESSAGE_SENDER_URL: ${{ secrets.PROLINE_MESSAGE_SENDER_URL }}
      PROLINE_MESSAGE_SENDER_TOKEN: ${{ secrets.PROLINE_MESSAGE_SENDER_TOKEN }}
      LINE_MESSAGE_SENDER_URL: ${{ secrets.LINE_MESSAGE_SENDER_URL }}
      LINE_MESSAGE_SENDER_TOKEN: ${{ secrets.LINE_MESSAGE_SENDER_TOKEN }}
      ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_HOST_USER_ID: ${{ secrets.ZOOM_HOST_USER_ID }}
      ZOOM_ACCOUNT_LABEL: ${{ secrets.ZOOM_ACCOUNT_LABEL }}
      DAILY_SUMMARY_ZOOM_ACCOUNTS_JSON: ${{ secrets.DAILY_SUMMARY_ZOOM_ACCOUNTS_JSON }}
      DAILY_SUMMARY_LINE_ACCOUNTS_JSON: ${{ secrets.DAILY_SUMMARY_LINE_ACCOUNTS_JSON }}
      INPUT_DATE: ${{ github.event.inputs.date }}
      INPUT_FUTURE_ONLY: ${{ github.event.inputs.future_only }}
      INPUT_FORCE_RESEND: ${{ github.event.inputs.force_resend }}
      INPUT_SKIP_DISCORD_SUMMARY: ${{ github.event.inputs.skip_discord_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run daily calendar summary
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [ "$INPUT_FUTURE_ONLY" = "true" ]; then
            args+=(--future-only)
          fi
          if [ "$INPUT_FORCE_RESEND" = "true" ]; then
            args+=(--force-resend)
          fi
          if [ "$INPUT_SKIP_DISCORD_SUMMARY" = "true" ]; then
            args+=(--skip-discord-summary)
          fi
          python scripts/github_daily_calendar_summary.py "${args[@]}"
